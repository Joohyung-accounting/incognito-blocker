org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP refuses to build when the project path contains non-ASCII characters.
# That path is common outside English-speaking locales (e.g. a Windows Desktop
# folder localised to another script), and the build works there in practice,
# so the check is overridden. Build OUTPUT is redirected to an ASCII path in
# settings.gradle.kts, which is what actually avoids the underlying problem.
android.overridePathCheck=true
